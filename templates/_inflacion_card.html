<div class="card widget-card">
  <div class="card-header d-flex justify-content-between align-items-start">
    <div>
      <div class="card-title">Inflación</div>
      <div class="card-subtitle">
        Fuente:
        <a href="{{ fuente_mensual }}" target="_blank" rel="noopener">mensual</a>
        · <a href="{{ fuente_interanual }}" target="_blank" rel="noopener">interanual</a>
        {% if error %} · <span style="color:#b91c1c;">{{ error }}</span>{% endif %}
      </div>
    </div>
    <span class="badge badge-soft">IPC</span>
  </div>

  <div class="card-body">
    <div class="series-meta">
      <div>Mensual: <strong>{{ "%.2f"|format(mensual.ultimo or 0) }}%</strong></div>
      <div>Interanual: <strong>{{ "%.2f"|format(interanual.ultimo or 0) }}%</strong></div>
      <div>Fecha: <strong>{{ mensual.fecha_ultimo or interanual.fecha_ultimo or '-' }}</strong></div>
    </div>

    <div class="inflacion-range-buttons">
      <button type="button" class="inflacion-range-btn active" data-years="1">1 año</button>
      <button type="button" class="inflacion-range-btn" data-years="2">2 años</button>
      <button type="button" class="inflacion-range-btn" data-years="3">3 años</button>
      <button type="button" class="inflacion-range-btn" data-years="5">5 años</button>
      <button type="button" class="inflacion-range-btn" data-years="10">10 años</button>
      <button type="button" class="inflacion-range-btn" data-years="todo">Todo</button>
    </div>

    <div
      class="rp-chart-inflacion"
      data-x-mensual='{{ (mensual.x or []) | tojson }}'
      data-y-mensual='{{ (mensual.y or []) | tojson }}'
      data-x-interanual='{{ (interanual.x or []) | tojson }}'
      data-y-interanual='{{ (interanual.y or []) | tojson }}'
      style="height:320px;"
    ></div>
  </div>
</div>

<style>
  .inflacion-range-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 14px 0 8px;
  }

  .inflacion-range-btn {
    border: 1px solid #d0d7e2;
    background: #f8fafc;
    color: #0f172a;
    padding: 5px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
  }

  .inflacion-range-btn.active {
    background: #e8eefc;
    border-color: #b8c6f0;
    font-weight: 700;
  }
</style>

<script>
(function () {
  const chart = document.querySelector(".rp-chart-inflacion");
  if (!chart || typeof Plotly === "undefined") return;

  const xMensual = JSON.parse(chart.dataset.xMensual || "[]");
  const yMensual = JSON.parse(chart.dataset.yMensual || "[]");
  const xInteranual = JSON.parse(chart.dataset.xInteranual || "[]");
  const yInteranual = JSON.parse(chart.dataset.yInteranual || "[]");

  function filtrarSerie(x, y, years) {
    if (years === "todo" || !x.length) {
      return { x: x, y: y };
    }

    const fechasValidas = x
      .map(d => new Date(d))
      .filter(d => !isNaN(d.getTime()));

    if (!fechasValidas.length) {
      return { x: x, y: y };
    }

    const maxDate = new Date(Math.max(...fechasValidas.map(d => d.getTime())));
    const minDate = new Date(maxDate);
    minDate.setFullYear(minDate.getFullYear() - parseInt(years));

    const xf = [];
    const yf = [];

    for (let i = 0; i < x.length; i++) {
      const d = new Date(x[i]);
      if (!isNaN(d.getTime()) && d >= minDate && d <= maxDate) {
        xf.push(x[i]);
        yf.push(y[i]);
      }
    }

    return { x: xf, y: yf };
  }

  function dibujarInflacion(years = "1") {
    const mensual = filtrarSerie(xMensual, yMensual, years);
    const interanual = filtrarSerie(xInteranual, yInteranual, years);

    const traces = [
      {
        x: mensual.x,
        y: mensual.y,
        type: "bar",
        name: "Mensual",
        yaxis: "y"
      },
      {
        x: interanual.x,
        y: interanual.y,
        type: "scatter",
        mode: "lines+markers",
        name: "Interanual",
        yaxis: "y2"
      }
    ];

    const layout = {
      margin: { l: 55, r: 55, t: 30, b: 50 },
      height: 320,
      legend: {
        orientation: "h",
        x: 0,
        y: 1.18
      },
      xaxis: {
        title: "Fecha",
        type: "date"
      },
      yaxis: {
        title: "Mensual %",
        rangemode: "tozero"
      },
      yaxis2: {
        title: "Interanual %",
        overlaying: "y",
        side: "right",
        rangemode: "tozero"
      },
      bargap: 0.2
    };

    Plotly.react(chart, traces, layout, {
      responsive: true,
      displayModeBar: false
    });
  }

  document.querySelectorAll(".inflacion-range-btn").forEach(btn => {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".inflacion-range-btn").forEach(b => b.classList.remove("active"));
      this.classList.add("active");
      dibujarInflacion(this.dataset.years);
    });
  });

  dibujarInflacion("1");
})();
</script>
